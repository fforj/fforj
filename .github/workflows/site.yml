name: Site

# Rebuilds the /next/ (unreleased main) docs on every push to main and redeploys
# the gh-pages branch. The branch is pure build output: every deploy amends the
# single existing commit and force-pushes, so it never accumulates history.
# Released versions (/ root and /v/X.Y.Z/) are written by release.yml only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site # shared with release.yml's site publish — queue, don't race

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags needed for versions.json and the install snippet

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build /next/ site from main
        run: |
          ./gradlew test javadoc
          LATEST=$(git tag -l 'v*' | sort -V | tail -1 | sed 's/^v//')
          java docs/SiteGen.java --version "${LATEST:-0.0.0}" \
            --prefix "next/" --channel "main" \
            --javadoc build/docs/javadoc --out out-next

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Replace /next/ and redeploy
        run: |
          rm -rf pages/next
          cp -R out-next pages/next
          latest=$(git tag -l 'v*' | sort -V | tail -1 | sed 's/^v//')
          {
            printf '{"latest":"%s","entries":[{"label":"%s (latest)","path":""}' "$latest" "$latest"
            for t in $(git tag -l 'v*' | sort -Vr | sed 's/^v//'); do
              printf ',{"label":"%s","path":"v/%s/"}' "$t" "$t"
            done
            printf ',{"label":"main (unreleased)","path":"next/"}]}\n'
          } > pages/versions.json
          echo "fforj.dev" > pages/CNAME
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --amend -m "site: next @ ${GITHUB_SHA::7}"
          git push --force
